<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.I. Libras - Quiz Interativo</title>
  <link rel="stylesheet" href="css/style.css?v=50">
  <link rel="stylesheet" href="css/quiz.css?v=50">
  <script src="js/components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="data/termos.js"></script>
</head>
<body>
  <app-header></app-header>

  <div class="quiz-top-bar">
    <span id="quizBreadcrumb">Hardware · Questão 1 de 1</span>
    <span id="quizPercent">0% concluído</span>
  </div>

  <div class="container quiz-container">
    <div class="card quiz-card">
      <div class="quiz-header">
        <span class="q-number" id="qNum">1</span>
        <h2>Qual termo está sendo sinalizado?</h2>
      </div>
      <div class="video-quiz-box">
        <video id="quizVideo" class="quiz-video" playsinline loop preload="auto"></video>
        <button class="quiz-play-btn" type="button" id="quizPlayBtn" aria-label="Reproduzir sinal"><i class="fa-solid fa-play"></i></button>
      </div>
    </div>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="quiz-actions">
      <button id="btnNext" class="btn-next" type="button">Próxima →</button>
    </div>
  </div>

  <app-footer></app-footer>

  <script src="js/auth.js"></script>
  <script src="js/progresso.js"></script>
  <script src="js/quizes.js?v=47"></script>
</body>
</html>
