<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.I Libras - Sinalário</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sinalario.css?v=22">
  <script src="js/components.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/dados.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <app-header></app-header>

  <div class="container main-layout">

    <!-- ============ COLUNA 1 · FILTROS + LISTA DE TERMOS ============ -->
    <aside class="sidebar-filtros">
      <div class="filtros-panel">
        <h2 class="filtros-title">Filtros</h2>

        <div class="filtros-field">
          <i class="fa-solid fa-shapes" id="filterIcon" aria-hidden="true"></i>
          <select class="filtros-select" id="categorySelect" title="Filtrar por área">
            <option value="todos">Todas as áreas</option>
            <option value="hardware">Hardware</option>
            <option value="software">Software</option>
            <option value="programacao">Programação</option>
            <option value="eletricidade">Eletricidade</option>
            <option value="redes">Redes</option>
            <option value="favoritos">Favoritos</option>
          </select>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Buscar Termo...">
        </div>

        <span class="terms-count" id="termsCount">16 TERMOS</span>

        <div class="terms-list" id="termsList"></div>
      </div>
    </aside>

    <!-- ============ COLUNA 2 · APRESENTAÇÃO DO SINAL ============ -->
    <main class="content-column">

      <header class="term-header" id="termHeader">
        <span class="category-row">
          <i class="fa-solid fa-desktop" id="displayCategoryIcon"></i>
          <span class="category-tag" id="displayCategory">HARDWARE</span>
        </span>
        <div class="term-title-row">
          <h2 id="displayTerm">Monitor</h2>
          <button class="btn-fav-large" id="btnMainFav" title="Favoritar Termo">
            <i class="fa-regular fa-heart"></i>
          </button>
        </div>
      </header>

      <!-- Card branco oficial do vídeo, com o cabeçalho padrão da Coluna 3 -->
      <div class="card-video-container">
        <div class="info-card-head">
          <span class="icon-circle lilas"><i class="fa-solid fa-circle-play"></i></span>
          <h3 class="info-card-title">Vídeo do sinal</h3>
        </div>

        <div class="video-wrapper-yt">
          <iframe
            id="ytPlayer"
            src="https://www.youtube.com/embed/?enablejsapi=1&rel=0"
            title="Vídeo do Sinal em Libras"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <section class="definicao-card">
        <div class="definicao-head">
          <span class="icon-circle roxo"><i class="fa-solid fa-book-open"></i></span>
          <h3 class="definicao-title">Definição do termo</h3>
        </div>
        <p id="displayDef">Dispositivo de saída que exibe a interface visual do computador.</p>
      </section>

    </main>

    <!-- ============ COLUNA 3 · DETALHAMENTO DO TERMO ============ -->
    <aside class="detalhes-column">

      <!-- 1º · TOPO: Imagem do termo -->
      <section class="info-card info-card--imagem">
        <div class="info-card-head">
          <span class="icon-circle lilas"><i class="fa-solid fa-image"></i></span>
          <h3 class="info-card-title">Imagem do termo</h3>
        </div>
        <div class="imagem-content">
          <img src="img/monitor.png" alt="Termo" id="termImage">
          <span class="img-placeholder" id="imgPlaceholder">
            <i class="fa-solid fa-image"></i>
            <span>Imagem em breve</span>
          </span>
        </div>
      </section>

      <!-- 2º · MEIO: Exemplo em português -->
      <section class="info-card info-card--exemplo">
        <div class="info-card-head">
          <span class="icon-circle lilas"><i class="fa-solid fa-comment-dots"></i></span>
          <h3 class="info-card-title">Exemplo em português</h3>
        </div>
        <p id="displayExPt">"O monitor exibe a imagem em alta definição."</p>
      </section>

      <!-- 3º · BASE: Exemplo em Libras -->
      <section class="info-card info-card--exemplo">
        <div class="info-card-head">
          <span class="icon-circle lilas"><i class="fa-solid fa-hands"></i></span>
          <h3 class="info-card-title">Exemplo em Libras</h3>
        </div>
        <p class="libras-text" id="displayExGlosa">MONITOR MOSTRAR IMAGEM BONITO</p>
      </section>

    </aside>
  </div>

  <app-footer></app-footer>

  <script src="js/auth.js"></script>
  <script src="js/progresso.js"></script>
  <script src="js/sinalario.js"></script>
</body>
</html>
